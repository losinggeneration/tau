---
version: "2"

linters:
  enable:
    - recvcheck
  disable:
    - varnamelen
    - paralleltest
    - mnd
    - lll
    - testpackage
    - cyclop
    - dupword
    - gocognit
    - depguard
    - dupl
    - exhaustruct
    - forbidigo
    - forcetypeassert
    - wrapcheck
    - gochecknoglobals
    - funlen
    - ireturn
    - gosec
    - godox
    - nestif
    - nonamedreturns
    - godot
    - goconst
    - gocyclo
    - noinlineerr
    - gosmopolitan
    - unparam
    - err113
    - funcorder
    - wsl
    - gocritic
    - gochecknoinits
    - nlreturn
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - govet
          - staticcheck
          - unused
settings:
  exhaustive:
    check:
      - switch
      - map
    default-signifies-exhaustive: true
  revive:
    enable-default-rules: true
    rules:
      - name: bare-return
        disabled: false
